<!doctype html>
<html lang="en" data-mode="dark" data-accent="console">
<head>
  <meta charset="utf-8" />
  <title>Andy Freeman — AI Engineering</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Andy Freeman's public AI engineering portfolio: evaluation tools, agent platforms, reusable Python libraries, and applied AI software." />

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Andy Freeman — AI Engineering" />
  <meta property="og:description" content="Public work in AI evaluation, agent platforms, reusable Python tools, and applied AI software." />
  <meta property="og:image" content="https://tafreeman.github.io/tafreeman/social-previews/tafreeman.png" />
  <meta property="og:url" content="https://tafreeman.github.io/tafreeman/" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- console-ds/styles.css defines the Console tokens (new names) used by the
       _ds_bundle.js primitives; tokens.css re-maps the profile's legacy token
       names (--fg-1, --font-display, --sp-*, --tracking-*, --radius-*) onto the
       same Console values so profile.jsx's inline styles resolve. Load both. -->
  <link rel="stylesheet" href="console-ds/styles.css" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="profile.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Crect x='45' y='12' width='8' height='40' fill='%2333b1ff'/%3E%3Cpath d='M11 48V16h9v24h18v8z' fill='%23f4f4f4'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="root"></div>

  <!-- Every script below is same-origin and already compiled. react/react-dom
       are vendored out of node_modules and the profile's JSX is transformed
       into dist/, both by `npm run build:js` (see scripts/build-js.mjs, which
       records what this replaced). This page used to pull React and a JSX
       compiler from a public CDN and compile the sources in the visitor's
       browser on every load — first render hung on three third-party requests
       plus an in-page compiler, and #root stayed blank forever whenever any of
       them was slow, blocked or down.

       NOT the whole of that failure mode, though: the two stylesheets above
       still @import fonts.googleapis.com, they are render-blocking, and they
       sit ahead of every script here. A font host that REFUSES a connection
       fails fast and the page renders on its fallback face — but one that
       hangs holds the whole page, scripts included, until the socket times
       out. Removing those imports (self-host the woff2 files) is what would
       actually finish this job.

       SRI is intentionally omitted for these same-origin assets: GitHub Pages
       enforces HTTPS, so they are already protected by TLS — integrity=
       hashes on local files would need re-hashing on every build with no
       security benefit.

       ORDER MATTERS, and it is now load order rather than Babel's: each file
       runs the moment it arrives. repo-data.jsx must precede dist/profile.js
       (which destructures window.PORTFOLIO at top level), and _ds_bundle.js
       must precede both (it installs the design-system primitives). -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="console-ds/_ds_bundle.js"></script>
  <script src="dist/tweaks-panel.js"></script>
  <script src="repo-data.jsx"></script>
  <script src="dist/profile.js"></script>

  <script>
    // Machine-edited region: the Tweaks host rewrites the JSON between the
    // EDITMODE markers on disk when a control changes (tweaks-panel.jsx's
    // __edit_mode_set_keys protocol), so this assignment stays inline, in
    // this file, exactly as it is.
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "mode": "dark",
      "accent": "console",
      "showMap": true
    }/*EDITMODE-END*/;

    // Written as React.createElement rather than <window.ProfilePage /> so
    // this block needs no compilation at all. It is the one script on the
    // page that has to stay hand-edited; a single JSX tag here would drag the
    // whole in-browser compiler back onto the critical path.
    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(window.ProfilePage)
    );
  </script>
</body>
</html>
