name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 08:00 UTC — re-runs link-check + Playwright without a commit

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install validators
        run: npm ci
      - name: Validate JSX/JS syntax
        run: npm run validate:jsx
      - name: Validate portfolio repo metadata
        run: npm run validate:repos
      - name: Validate HTML
        run: npm run validate:html
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests (required)
        run: npm test -- --grep-invert @network
      - name: Run Playwright outbound-link tests (advisory)
        run: npm test -- --grep @network
        continue-on-error: true
      - name: Check links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --verbose --no-progress --accept '200..=204,301,302'
            --exclude-path node_modules --exclude-path .git
            --exclude '^https://fonts\.googleapis\.com/?$'
            --exclude '^https://fonts\.gstatic\.com/?$'
            --exclude '^https://www\.linkedin\.com/in/andy-freeman-architect/?$'
            README.md '*.html' '*.jsx'
          fail: true
