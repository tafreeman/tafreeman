name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install validators
        run: npm ci
      - name: Validate JSX/JS syntax
        run: npm run validate:jsx
      - name: Validate HTML
        run: npm run validate:html
