name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install validators
        run: npm ci
      - name: Validate JSX/JS syntax
        run: npm run validate:jsx
      - name: Validate HTML
        run: npm run validate:html
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose --no-progress --accept 301,302
            --exclude-path node_modules --exclude-path .git
            --exclude '^https://fonts\.googleapis\.com/?$'
            --exclude '^https://fonts\.gstatic\.com/?$'
            --exclude '^https://www\.linkedin\.com/in/andy-freeman-architect/?$'
            README.md '*.html' '*.jsx'
          fail: true
